<div class="search-bar">
  <label for="search-bar-input"
    ><i #searcher class="fa-solid fa-magnifying-glass"></i
  ></label>
  <input
    name="search-bar-input"
    type="text"
    (change)="submitInput()"
    [formControl]="validationForm"
    [(ngModel)]="value"
    (input)="clickOnInput()"
  />
</div>
